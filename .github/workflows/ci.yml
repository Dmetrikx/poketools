name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  backend:
    name: Go vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # web/embed.go embeds web/dist, which is gitignored build output. The
      # backend job doesn't need the real frontend, just something to embed.
      - run: mkdir -p web/dist && touch web/dist/index.html
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
